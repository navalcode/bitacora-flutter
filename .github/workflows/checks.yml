name: Flutter checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Configure tools and resolve locked dependencies
        run: |
          flutter config --jdk-dir "$JAVA_HOME"
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          flutter pub get --enforce-lockfile
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test --reporter expanded
      - name: Build both Android flavors and optimized bundle
        run: |
          flutter build apk --debug --flavor dev
          flutter build apk --debug --flavor prod
          flutter build appbundle --release --flavor prod
      - name: Build web with local runtime assets
        run: flutter build web --dart-define=APP_ENV=dev --no-web-resources-cdn --pwa-strategy=none
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-preview
          path: build/web
          retention-days: 7
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Configure tools and locked dependencies
        run: |
          flutter config --jdk-dir "$JAVA_HOME"
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          flutter pub get --enforce-lockfile
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 8192M
          ram-size: 2048M
          disable-animations: true
          script: flutter test integration_test/app_test.dart --flavor dev -d emulator-5554 --reporter expanded
